openapi: 3.1.0
info:
  title: PetalPath Backend API
  description: >
    Adaptive learning platform API for children's educational journey.
    Authentication via JWT bearer token. All protected endpoints require
    the `Authorization: Bearer <token>` header.
  version: 2.0.0
  contact:
    name: PetalPath Team

servers:
  - url: http://localhost:3000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          description: Response payload
        message:
          type: string
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [PARENT, ADMIN]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Child:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        avatar:
          type: string
        grade:
          type: string
        parentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        order:
          type: integer
    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        order:
          type: integer
    Lesson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        moduleId:
          type: string
          format: uuid
        order:
          type: integer
        content:
          type: object
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        lessonId:
          type: string
          format: uuid
        type:
          type: string
          enum: [VIDEO, LISTEN, SPEAK, WRITE, QUIZ, GAME]
        order:
          type: integer
        content:
          type: object
    Video:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        thumbnail:
          type: string
        duration:
          type: integer
        lessonId:
          type: string
          format: uuid
    Audio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        duration:
          type: integer
    Mentor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type: string
        expertise:
          type: array
          items:
            type: string
    ProgressItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        completed:
          type: boolean
        score:
          type: number
        timeSpent:
          type: integer
        createdAt:
          type: string
          format: date-time
    SessionObj:
      type: object
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACTIVE, PAUSED, COMPLETED, ABANDONED]
        type:
          type: string
        blocks:
          type: array
          items:
            type: object
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    Reward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [STICKER, BADGE, TROPHY]
        icon:
          type: string
        description:
          type: string
    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: object
        pages:
          type: integer
        category:
          type: string
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            type: object
        skillId:
          type: string
          format: uuid
    Attempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        assessmentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]
        score:
          type: number
        answers:
          type: array
          items:
            type: object
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        type:
          type: string
        data:
          type: object
        createdAt:
          type: string
          format: date-time
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum: [true]
              message:
                type: string
    Created:
      description: Resource created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum: [true]
              data:
                type: object
              message:
                type: string
    AuthSuccess:
      description: Authentication success (tokens + user data)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum: [true]
              data:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
              message:
                type: string
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized (missing or invalid token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden (insufficient permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. duplicate)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Authentication
    description: Authentication endpoints (Google OAuth, email/password, JWT)
  - name: Users
    description: User management CRUD
  - name: Children
    description: Child profile management (authMiddleware)
  - name: Categories
    description: Content category CRUD
  - name: Modules
    description: Learning module CRUD
  - name: Lessons
    description: Lesson CRUD
  - name: Activities
    description: Activity CRUD
  - name: Videos
    description: Video resource CRUD
  - name: Audio
    description: Audio resource list (authMiddleware)
  - name: Mentors
    description: Mentor profiles (authMiddleware)
  - name: Progress
    description: Lesson/module/category progress tracking (authMiddleware)
  - name: VideoProgress
    description: Video watch progress (authMiddleware)
  - name: ListenProgress
    description: Listen activity progress (authMiddleware)
  - name: SpeakProgress
    description: Speak activity progress (authMiddleware)
  - name: WriteProgress
    description: Write activity progress (authMiddleware)
  - name: Rewards
    description: Reward catalog (stickers, badges) (authMiddleware)
  - name: Stories
    description: Interactive stories with page tracking (authMiddleware)
  - name: Assessments
    description: Assessment catalog and attempt management (authMiddleware + child ownership)
  - name: Mastery
    description: Skill mastery tracking and health metrics (authMiddleware)
  - name: Curriculum
    description: Personalized curriculum generation and management (authMiddleware)
  - name: Adaptive
    description: Adaptive learning engine (authMiddleware)
  - name: Reinforcement
    description: Reinforcement learning queue and history (authMiddleware)
  - name: Session
    description: Learning session lifecycle management (authMiddleware)
  - name: Analytics
    description: Aggregated learning analytics and insights (authMiddleware)
  - name: Notifications
    description: Push notification management (authMiddleware)
  - name: Learner
    description: Learner state facade (authMiddleware + child ownership)
  - name: LearningEvents
    description: Learning event and evidence tracking (authMiddleware)
  - name: IntelligenceCore
    description: Observation, evidence processing, and classification engine (authMiddleware)
  - name: AdaptivePlanning
    description: Dynamic roadmap, learning debts, recovery, session plans (authMiddleware)
  - name: AdaptiveCurriculum
    description: Public read-only curriculum catalog (authMiddleware)
  - name: AdaptiveCurriculumAdmin
    description: Admin curriculum CRUD (authMiddleware + adminMiddleware)
  - name: Placement
    description: Placement test questionnaire (authMiddleware + child ownership)
  - name: SkillRoadmap
    description: Adaptive skill roadmap (authMiddleware + child ownership)
  - name: MasteryEngine
    description: Mastery evaluation, recalc, revision queue (authMiddleware + child ownership)
  - name: AITutor
    description: AI-powered tutoring sessions (authMiddleware + child ownership)
  - name: Adaptation
    description: Child learning analysis and profile (authMiddleware + child ownership)
  - name: Health
    description: Health check endpoints (no auth)
  - name: SessionPlanner
    description: Session planning and generation (authMiddleware)
  - name: Roadmap
    description: Simple roadmap endpoint (authMiddleware)

paths:
  /auth/google:
    post:
      tags: [Authentication]
      summary: "Google Sign-In"
      operationId: authGoogleSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: "string"
                  description: "Google identity token"
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags: [Authentication]
      summary: "Register a new user"
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 8
                name:
                  type: "string"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Authentication]
      summary: "Login with email and password"
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: "Logout"
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: "Refresh access token"
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: "string"
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: "Send password reset email"
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: "string"
                  format: "email"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: "Reset password with token"
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: "string"
                password:
                  type: "string"
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/me:
    get:
      tags: [Authentication]
      summary: "Get current user"
      operationId: authGetMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Current user data"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/select-child:
    post:
      tags: [Authentication]
      summary: "Select active child"
      operationId: authSelectChild
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId]
              properties:
                childId:
                  type: "string"
                  format: "uuid"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users:
    get:
      tags: [Users]
      summary: "List all users"
      operationId: usersList
      responses:
        '200':
          description: "Array of users"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    post:
      tags: [Users]
      summary: "Create a new user"
      operationId: usersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 8
                name:
                  type: "string"
                role:
                  type: "string"
                  enum:
                    - "PARENT"
                    - "ADMIN"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    get:
      tags: [Users]
      summary: "Get user by ID"
      operationId: usersGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "User object"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}:
    put:
      tags: [Users]
      summary: "Update user"
      operationId: usersUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: "string"
                email:
                  type: "string"
                  format: "email"
                password:
                  type: "string"
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}:
    delete:
      tags: [Users]
      summary: "Delete user"
      operationId: usersDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
  /children:
    get:
      tags: [Children]
      summary: "List children"
      operationId: childrenList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Array of children"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /children:
    post:
      tags: [Children]
      summary: "Create child profile"
      operationId: childrenCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: "string"
                dateOfBirth:
                  type: "string"
                  format: "date"
                avatar:
                  type: "string"
                grade:
                  type: "string"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /children/{id}:
    get:
      tags: [Children]
      summary: "Get child by ID"
      operationId: childrenGetById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Child object"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /children/{id}:
    put:
      tags: [Children]
      summary: "Update child profile"
      operationId: childrenUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: "string"
                dateOfBirth:
                  type: "string"
                  format: "date"
                avatar:
                  type: "string"
                grade:
                  type: "string"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /children/{id}:
    delete:
      tags: [Children]
      summary: "Delete child profile"
      operationId: childrenDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories:
    get:
      tags: [Categories]
      summary: "List all categories"
      operationId: categoriesList
      responses:
        '200':
          description: "Array of categories"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
  /categories:
    post:
      tags: [Categories]
      summary: "Create category"
      operationId: categoriesCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: "string"
                description:
                  type: "string"
                icon:
                  type: "string"
                order:
                  type: "integer"
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
  /categories/{id}:
    get:
      tags: [Categories]
      summary: "Get category by ID"
      operationId: categoriesGetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Category object"
          content:
            application/json:
              schema:
                allOf:
                  - 
                    $ref: '#/components/schemas/ApiResponse'
                  - 
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{id}:
    put:
      tags: [Categories]
      summary: "Update category"
      operationId: categoriesUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: "string"
                description:
                  type: "string"
                icon:
                  type: "string"
                order:
                  type: "integer"
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{id}:
    delete:
      tags: [Categories]
      summary: "Delete category"
      operationId: categoriesDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
  /modules:
    get:
      tags: [Modules]
      summary: "List all modules"
      operationId: modulesList
      responses:
        '200':
